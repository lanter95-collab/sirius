<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Words</title>
    <style>
        :root {
            --bg-color: #f9f9f9;
            --container-bg: #ffffff;
            --border-color: #dcdcdc;
            --text-color: #444;
            --btn-bg: #f0f0f0;
            --btn-hover: #e0e0e0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            margin: 0;
            padding: 10px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-size: 14px;
        }
        #app-container {
            max-width: 600px;
            margin: 0 auto;
            background: var(--container-bg);
            padding: 15px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
        }
        h1 {
            margin: 0 0 15px 0;
            font-size: 1.1rem;
            color: #777;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 5px;
        }

        /* --- 控制列 --- */
        .controls-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        button, select {
            background-color: var(--btn-bg);
            border: 1px solid var(--border-color);
            color: #333;
            padding: 5px 12px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 13px;
            outline: none;
        }
        button:hover { background-color: var(--btn-hover); }
        #play-pause-btn { min-width: 40px; text-align: center; }
        
        .checkbox-group {
            display: flex;
            gap: 15px;
            font-size: 13px;
            color: #555;
            margin-left: auto;
        }
        .checkbox-item { display: flex; align-items: center; gap: 5px; cursor: pointer; }

        /* --- 上半部顯示區 (圖片 或 文字) --- */
        #display-area {
            position: relative;
            width: 100%;
            height: 300px;
            border: 1px solid var(--border-color);
            background: #fafafa;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 8px;
            overflow: hidden;
            text-align: center;
        }
        
        #current-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: none;
        }
        #top-text-display {
            font-size: 3rem;
            font-weight: bold;
            color: #333;
            padding: 20px;
            display: none;
            word-break: break-word;
        }

        /* 隱藏按鈕 (-) - 右上角 */
        #hide-card-btn {
            position: absolute;
            top: 0; right: 0;
            padding: 5px 10px;
            color: #999;
            font-size: 16px;
            cursor: pointer;
            z-index: 10;
        }
        #hide-card-btn:hover { background: #eee; color: #333; }
        
        /* 刪除按鈕 (×) - 左上角 */
        #delete-card-btn {
            position: absolute;
            top: 0; left: 0;
            padding: 5px 10px;
            color: #999;
            font-size: 16px;
            cursor: pointer;
            z-index: 10;
        }
        #delete-card-btn:hover { background: #fee; color: #d9534f; } /* 刪除用微紅色提示 */

        /* 導航按鈕 */
        .nav-btn {
            position: absolute;
            top: 0; bottom: 0;
            width: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ccc;
            font-size: 24px;
            cursor: pointer;
            user-select: none;
        }
        .nav-btn:hover { color: #666; background: rgba(0,0,0,0.02); }
        #prev-btn { left: 0; }
        #next-btn { right: 0; }

        /* --- 內容修改欄位 (分兩行) --- */
        .edit-input-row { 
            width: 100%;
            display: flex;
            gap: 5px;
            margin-bottom: 5px;
        }
        .edit-input-row label {
            width: 50px; 
            min-width: 50px;
            font-size: 12px;
            color: #777;
            padding-top: 6px;
        }
        .edit-input-row input {
            flex-grow: 1;
            padding: 5px;
            border: 1px solid var(--border-color);
            background: #fff;
            color: #999;
            font-size: 12px;
            box-sizing: border-box;
        }
        .edit-input-row input:focus { color: #333; border-color: #999; }
        
        /* 下方文字顯示區 */
        #word-display {
            width: 100%;
            min-height: 80px;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid var(--border-color);
            background: #fff;
            color: #333;
            text-align: center;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            white-space: pre-wrap;
            margin-top: 8px;
        }
        
        .text-hidden { color: transparent !important; text-shadow: none; }
        
        /* --- 編輯與匯入匯出 --- */
        details {
            margin-top: 15px;
            border-top: 1px solid var(--border-color);
            padding-top: 10px;
            color: #777;
        }
        summary { cursor: pointer; font-size: 12px; margin-bottom: 10px; outline: none; }
        .new-card-input-group { 
            display: flex; 
            flex-direction: column; 
            gap: 5px;
        }
        .new-card-input-row {
            display: flex;
            gap: 5px;
            align-items: center;
        }
        .new-card-input-row input, .new-card-input-row textarea {
            flex: 1;
            padding: 6px;
            border: 1px solid var(--border-color);
            border-radius: 3px;
            font-size: 13px;
        }
        .footer-tools {
            margin-top: 10px;
            display: flex;
            justify-content: flex-end;
            gap: 5px;
        }
        #clear-btn { color: #d9534f; border-color: #f5c6cb; background: #fff; }
        #clear-btn:hover { background: #f8d7da; }

    </style>
</head>
<body>

<div id="app-container">
    <h1>Words</h1>

    <div class="controls-bar">
        <button id="play-pause-btn" title="播放/暫停">▶</button>
        <select id="interval-select">
            <option value="3000">3s</option>
            <option value="4000">4s</option>
            <option value="5000">5s</option>
        </select>

        <div class="checkbox-group">
            <label class="checkbox-item"><input type="checkbox" id="show-all-check"> Show all</label>
            <label class="checkbox-item"><input type="checkbox" id="hide-text-check"> Hide</label>
        </div>
    </div>

    <div id="display-area">
        <div id="delete-card-btn" title="永久刪除此卡">×</div> <div id="hide-card-btn" title="暫時隱藏此卡">-</div>
        <div id="prev-btn" class="nav-btn">❮</div>
        <div id="next-btn" class="nav-btn">❯</div>
        
        <img id="current-image" src="" alt="">
        <div id="top-text-display"></div>
    </div>

    <div class="edit-input-row">
        <label for="current-img-url">Image URL</label>
        <input type="text" id="current-img-url" placeholder="圖片網址">
    </div>
    <div class="edit-input-row">
        <label for="current-top-text">Top Text</label>
        <input type="text" id="current-top-text" placeholder="上半部文字">
    </div>

    <div id="word-display"></div>

    <details open>
        <summary>編輯與設定</summary>
        <div class="new-card-input-group">
            <div class="new-card-input-row">
                <input type="text" id="new-img-url" placeholder="1) 圖片網址 (Image URL)">
            </div>
            <div class="new-card-input-row">
                <input type="text" id="new-top-text" placeholder="2) 上半部文字 (Top Text)">
            </div>
            <div class="new-card-input-row">
                <textarea id="new-bottom-content" rows="1" placeholder="3) 下方解釋文字 (Bottom Text)"></textarea>
                <button id="add-btn">新增</button>
            </div>
        </div>

        <div class="footer-tools">
            <button id="import-btn">匯入</button>
            <button id="export-btn">匯出</button>
            <button id="clear-btn">清空</button>
            <input type="file" id="file-input" style="display: none;" accept=".json">
        </div>
    </details>
</div>

<script>
    // --- 資料結構 ---
    // card: { imgUrl: string, topText: string, bottomText: string, visible: boolean }
    let wordCards = [];
    let currentIndex = -1;
    let playInterval = null;
    let isPlaying = false;
    let tempReveal = false;

    // --- DOM ---
    const els = {
        img: document.getElementById('current-image'),
        topTextDisplay: document.getElementById('top-text-display'),
        wordDisplay: document.getElementById('word-display'),
        playBtn: document.getElementById('play-pause-btn'),
        showAllCheck: document.getElementById('show-all-check'),
        hideTextCheck: document.getElementById('hide-text-check'),
        
        currentImgUrlInput: document.getElementById('current-img-url'),
        currentTopTextInput: document.getElementById('current-top-text'),
        newImgUrlInput: document.getElementById('new-img-url'),
        newTopTextInput: document.getElementById('new-top-text'),
        newBottomContentInput: document.getElementById('new-bottom-content'),
        
        addBtn: document.getElementById('add-btn'),
        clearBtn: document.getElementById('clear-btn'),
        hideCardBtn: document.getElementById('hide-card-btn'),
        deleteCardBtn: document.getElementById('delete-card-btn'), // 新增 DOM 元素
        
        prevBtn: document.getElementById('prev-btn'),
        nextBtn: document.getElementById('next-btn'),
        intervalSelect: document.getElementById('interval-select'),
        exportBtn: document.getElementById('export-btn'),
        importBtn: document.getElementById('import-btn'),
        fileInput: document.getElementById('file-input')
    };

    // --- 核心邏輯 ---

    function init() {
        const saved = localStorage.getItem('wordsData_stealth_v4'); // 沿用 V4 的 storage key
        if (saved) {
            try { 
                wordCards = JSON.parse(saved);
                // 數據結構遷移：確保舊版數據 'url' 欄位能被正確分配 (如果從 V3 升級)
                wordCards = wordCards.map(card => {
                    if (card.url !== undefined && card.imgUrl === undefined && card.topText === undefined) {
                        if (isImageUrl(card.url)) {
                            card.imgUrl = card.url;
                            card.topText = '';
                        } else {
                            card.imgUrl = '';
                            card.topText = card.url;
                        }
                        delete card.url; 
                    }
                    if (card.text !== undefined && card.bottomText === undefined) {
                        card.bottomText = card.text;
                        delete card.text; 
                    }
                    return card;
                });
            } catch(e) { wordCards = []; }
        }
        updateUI(0);
    }

    function save() {
        localStorage.setItem('wordsData_stealth_v4', JSON.stringify(wordCards));
    }

    function getPlayableIndices() {
        const showAll = els.showAllCheck.checked;
        return wordCards
            .map((card, index) => ({ index, visible: card.visible !== false }))
            .filter(item => showAll || item.visible)
            .map(item => item.index);
    }

    function isImageUrl(string) {
        if (!string) return false;
        return string.trim().toLowerCase().startsWith('http') && string.trim().length > 10;
    }

    function updateUI(targetIndex) {
        const indices = getPlayableIndices();

        if (indices.length === 0) {
            els.img.style.display = 'none';
            els.topTextDisplay.style.display = 'block';
            els.topTextDisplay.innerText = "No Data";
            els.currentImgUrlInput.value = "";
            els.currentTopTextInput.value = "";
            els.wordDisplay.innerText = "";
            els.wordDisplay.classList.remove('text-hidden');
            currentIndex = -1;
            stopPlayer();
            return;
        }

        if (!indices.includes(targetIndex)) targetIndex = indices[0];
        currentIndex = targetIndex;
        const card = wordCards[currentIndex];

        // --- 處理上半部顯示 ---
        const imageUrl = card.imgUrl || "";
        const topText = card.topText || "";
        
        els.currentImgUrlInput.value = imageUrl;
        els.currentTopTextInput.value = topText;

        if (isImageUrl(imageUrl)) {
            els.img.src = imageUrl;
            els.img.style.display = 'block';
            els.topTextDisplay.style.display = 'none';
        } else {
            els.img.style.display = 'none';
            els.topTextDisplay.innerText = topText || 'No Top Content';
            els.topTextDisplay.style.display = 'block';
        }

        // --- 處理下半部解釋文字 ---
        els.wordDisplay.innerHTML = (card.bottomText || '').replace(/\n/g, '<br>');

        // --- 隱藏邏輯 ---
        let shouldHide = false;
        if (isPlaying) {
            shouldHide = true;
            tempReveal = false;
        } else {
            if (els.hideTextCheck.checked) shouldHide = !tempReveal;
            else shouldHide = false;
        }

        if (shouldHide) els.wordDisplay.classList.add('text-hidden');
        else els.wordDisplay.classList.remove('text-hidden');
    }

    // --- 播放器控制與導航 (保持不變) ---
    function togglePlay() { isPlaying ? stopPlayer() : startPlayer(); }
    function startPlayer() {
        if (getPlayableIndices().length === 0) return;
        isPlaying = true;
        els.playBtn.innerText = "❚❚";
        tempReveal = false;
        updateUI(currentIndex);
        if (playInterval) clearInterval(playInterval);
        playInterval = setInterval(() => goNext(true), parseInt(els.intervalSelect.value));
    }
    function stopPlayer() {
        isPlaying = false;
        els.playBtn.innerText = "▶";
        tempReveal = false;
        updateUI(currentIndex);
        if (playInterval) clearInterval(playInterval);
    }
    function goNext(auto = false) {
        tempReveal = false;
        const indices = getPlayableIndices();
        if (indices.length === 0) return;
        let currentPos = indices.indexOf(currentIndex);
        let nextPos = (currentPos + 1) % indices.length;
        if (!auto && isPlaying) {
             clearInterval(playInterval);
             playInterval = setInterval(() => goNext(true), parseInt(els.intervalSelect.value));
        }
        updateUI(indices[nextPos]);
    }
    function goPrev() {
        tempReveal = false;
        const indices = getPlayableIndices();
        if (indices.length === 0) return;
        let currentPos = indices.indexOf(currentIndex);
        let prevPos = (currentPos - 1 + indices.length) % indices.length;
        if (isPlaying) {
             clearInterval(playInterval);
             playInterval = setInterval(() => goNext(true), parseInt(els.intervalSelect.value));
        }
        updateUI(indices[prevPos]);
    }

    // --- 永久刪除功能 ---
    function deleteCurrentCard() {
        if (currentIndex === -1) return;
        
        // 找出實際的 Index (因為 currentIndex 是基於原始陣列)
        const originalIndex = currentIndex;

        if (confirm(`確定要永久刪除此卡片嗎？\n(Image: ${wordCards[originalIndex].imgUrl.substring(0, 30)}...)\n(Text: ${wordCards[originalIndex].topText || wordCards[originalIndex].bottomText})`)) {
            
            // 從陣列中移除
            wordCards.splice(originalIndex, 1);
            save();

            // 重新計算要顯示的下一張卡片索引
            const indices = getPlayableIndices();
            
            if (indices.length > 0) {
                // 嘗試顯示下一個（或第一個）
                let nextIndex = originalIndex;
                if (nextIndex >= wordCards.length) nextIndex = 0; // 如果刪除最後一個，則回到第一個
                
                // 重新載入畫面
                updateUI(nextIndex);
            } else {
                updateUI(-1); // 沒牌了
            }
        }
    }


    // --- 事件處理 ---

    els.playBtn.addEventListener('click', togglePlay);
    els.prevBtn.addEventListener('click', (e) => { e.stopPropagation(); goPrev(); });
    els.nextBtn.addEventListener('click', (e) => { e.stopPropagation(); goNext(); });
    els.showAllCheck.addEventListener('change', () => updateUI(currentIndex));
    els.hideTextCheck.addEventListener('change', () => updateUI(currentIndex));
    
    els.wordDisplay.addEventListener('click', () => {
        if (isPlaying) {
            stopPlayer();
            tempReveal = true;
            updateUI(currentIndex);
        } else {
            if (els.hideTextCheck.checked) {
                if (els.wordDisplay.classList.contains('text-hidden')) {
                    tempReveal = true;
                    updateUI(currentIndex);
                } else {
                    startPlayer();
                }
            } else {
                startPlayer();
            }
        }
    });

    // 新增卡片
    els.addBtn.addEventListener('click', () => {
        const newImgUrl = els.newImgUrlInput.value.trim();
        const newTopText = els.newTopTextInput.value.trim();
        const newBottomText = els.newBottomContentInput.value.trim();
        
        if (!newImgUrl && !newTopText && !newBottomText) return;
        
        wordCards.push({ imgUrl: newImgUrl, topText: newTopText, bottomText: newBottomText, visible: true });
        save();
        els.newImgUrlInput.value = '';
        els.newTopTextInput.value = '';
        els.newBottomContentInput.value = '';
        
        if (!isPlaying) updateUI(wordCards.length - 1);
    });
    els.newBottomContentInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); els.addBtn.click(); }
    });

    // 修改當前卡片內容
    function handleCardUpdate() {
        if (currentIndex !== -1) {
            wordCards[currentIndex].imgUrl = els.currentImgUrlInput.value.trim();
            wordCards[currentIndex].topText = els.currentTopTextInput.value.trim();
            save();
            updateUI(currentIndex);
        }
    }
    els.currentImgUrlInput.addEventListener('change', handleCardUpdate);
    els.currentTopTextInput.addEventListener('change', handleCardUpdate);
    
    // 隱藏卡片
    els.hideCardBtn.addEventListener('click', () => {
        if (currentIndex !== -1) {
            wordCards[currentIndex].visible = false;
            save();
            const indices = getPlayableIndices();
            if (indices.length > 0) goNext(false);
            else updateUI(-1);
        }
    });
    
    // 永久刪除卡片 (新功能)
    els.deleteCardBtn.addEventListener('click', deleteCurrentCard);

    // 清空資料
    els.clearBtn.addEventListener('click', () => {
        if (confirm('確定要清空所有資料嗎？此動作無法復原。')) {
            wordCards = [];
            save();
            stopPlayer();
            updateUI(-1);
            alert('資料已清空');
        }
    });

    // 匯入匯出
    els.exportBtn.addEventListener('click', () => {
        const blob = new Blob([JSON.stringify(wordCards)], {type : 'application/json'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `words_${Date.now()}.json`;
        a.click();
    });
    els.importBtn.addEventListener('click', () => els.fileInput.click());
    els.fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
            try {
                const d = JSON.parse(evt.target.result);
                if (Array.isArray(d)) { wordCards = d; save(); updateUI(0); alert('匯入成功'); }
            } catch(err) {}
        };
        reader.readAsText(file);
        els.fileInput.value = '';
    });

    init();
</script>
</body>
</html>
